<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluacion Sumativa</title>
    <style>
        .contenedor {
            max-width: 600px;
            margin: 1 auto;
            padding: 20px;
        }
        .campo {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-enviar {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .titulo {
            font-family: "Arial, sans-serif";
            text-align: border;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="titulo">
  <h1>Datos del Usuario</h1>

   </div>
    <div class="contenedor">
        <input id="nombre" type="text" name="nombre" placeholder="Nombre" class="campo" required>
        <input id="email" type="email" name="email" placeholder="Email" class="campo" required>
        <input id="numero" type="number" name="Numero" placeholder="Numero" class="campo" required>
        <input id="mensaje" type="text" name="mensaje" placeholder="Mensaje" class="campo" required>
        <button type="button" onclick="mostrarDatos()" class="btn-enviar">Enviar Datos</button>
        <div id="resultado" class="caja-resultado"></div>
    </div>
<script src="script.js"></script>
</body>
</html>
